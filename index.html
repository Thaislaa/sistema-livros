<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Livros</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="div-header container">
            <div class="div-logo">
                <img src="img/logo-livros.png" alt="Logo">
                <p>Sistema de Livros</p>
            </div>

            <div class="div-busca">
                <img src="img/icon-lupa.png" id="btnBusca" alt="Buscar" />
                <input type="text" id="txtBusca" placeholder="Buscar livros..." />
            </div>
        </div>
    </header>

    <main>
        <h1>Livros</h1>
        <div class="livros">
        </div>
    </main>
    <script type="module" src="js/script.js"></script>
</body>

</html>
