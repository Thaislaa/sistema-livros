<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Livros</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="div-header container">
            <div class="div-logo">
                <img src="img/logo-livros.png" alt="Logo">
                <p>Sistema de Livros</p>
            </div>

            <div class="div-busca">
                <img src="img/icon-lupa.png" id="btnBusca" alt="Buscar" />
                <input type="text" id="txtBusca" placeholder="Buscar livros..." />
            </div>
        </div>
    </header>

    <main class="container">
        <div class="div-txt-inicial">
            <h1>Nossos Livros</h1>
            <p>Explore nossa coleção de livros e encontre sua próxima leitura favorita.</p>
        </div>

        <select id="selectCategoria">
            <option value="">Todas as categorias</option>
            <option value="Fantasia">Fantasia</option>
            <option value="Ficção">Ficção</option>
            <option value="Romance">Romance</option>
            <option value="Infantil">Infantil</option>
            <option value="Suspense">Suspense</option>
        </select>

        <div class="div-mensagem-nao-encontrado"></div>

        <div class="livros"></div>
    </main>
    <script type="module" src="js/script.js"></script>
</body>

</html>
